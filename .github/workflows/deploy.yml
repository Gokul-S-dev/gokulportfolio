name: Deploy

on:
  push:
    branches:
      - main  # or your source branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- This line is crucial!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: npm run build  # or whatever your build step is

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # or your build output folder
